<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture motion study</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070b; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f5f7fb; }
    .stage { width: 100%; height: 100%; display: grid; place-items: center; background: #05070b; }
    canvas { display: block; width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); background: #05070b; }
    .controls {
      position: fixed; left: 24px; right: 24px; bottom: 22px; display: flex; align-items: center; gap: 12px;
      opacity: .08; transition: opacity .25s ease; z-index: 4;
    }
    .controls:hover, .controls:focus-within { opacity: 1; }
    .controls button { border: 1px solid rgba(255,255,255,.24); background: rgba(5,7,11,.72); color: #fff; border-radius: 999px; padding: 8px 14px; cursor: pointer; font: inherit; font-size: 12px; }
    .controls button:hover { border-color: #8ab5ff; }
    .controls input { flex: 1; accent-color: #8ab5ff; }
    .controls span { min-width: 52px; color: #a4adbc; font: 11px "SFMono-Regular", Consolas, monospace; }
    .hint { position: fixed; right: 24px; top: 20px; color: rgba(255,255,255,.3); font: 10px "SFMono-Regular", Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; z-index: 4; }
    .recording .controls, .recording .hint { display: none; }
    @media (prefers-reduced-motion: reduce) { .controls { opacity: 1; } }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="motion" width="1920" height="1080" role="img" aria-label="Cinematic architecture motion study showing a request moving through a web application architecture"></canvas>
  </main>
  <div class="hint">space pause · arrows scrub · R render</div>
  <div class="controls" aria-label="Motion preview controls">
    <button id="play" type="button">Pause</button>
    <button id="render" type="button">Render WebM</button>
    <input id="scrub" type="range" min="0" max="20" value="0" step="0.01" aria-label="Timeline position">
    <span id="time">00:00</span>
  </div>
  <script>
    (() => {
      const canvas = document.querySelector('#motion');
      const ctx = canvas.getContext('2d');
      const playButton = document.querySelector('#play');
      const renderButton = document.querySelector('#render');
      const scrub = document.querySelector('#scrub');
      const timeLabel = document.querySelector('#time');
      const W = canvas.width;
      const H = canvas.height;
      const DURATION = 20;
      const prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const TAU = Math.PI * 2;

      const nodes = {
        frontend: { x: 220, y: 560, label: 'FRONTEND', name: 'Creda', sub: 'a case begins here', color: '#8ab5ff' },
        api: { x: 520, y: 560, label: 'EDGE', name: 'API Gateway', sub: 'accept + acknowledge', color: '#8ab5ff' },
        lambda: { x: 850, y: 560, label: 'COMPUTE', name: 'API Lambda', sub: 'validate + persist', color: '#8ab5ff' },
        dynamo: { x: 1210, y: 330, label: 'STATE', name: 'DynamoDB', sub: 'the durable case', color: '#8ab5ff' },
        sqs: { x: 1170, y: 770, label: 'ASYNC', name: 'SQS', sub: 'move work off-path', color: '#64e2aa' },
        worker: { x: 1500, y: 770, label: 'COMPUTE', name: 'Worker Lambda', sub: 'evidence + verdict', color: '#64e2aa' },
        dlq: { x: 1500, y: 320, label: 'RECOVERY', name: 'DLQ', sub: 'isolate the failure', color: '#ff8f9b' },
        cloudwatch: { x: 1690, y: 520, label: 'OBSERVE', name: 'CloudWatch', sub: 'make it visible', color: '#ff8f9b' }
      };

      const edges = {
        'frontend-api': ['frontend', 'api', '#8ab5ff'],
        'api-lambda': ['api', 'lambda', '#8ab5ff'],
        'lambda-dynamo': ['lambda', 'dynamo', '#8ab5ff'],
        'lambda-sqs': ['lambda', 'sqs', '#64e2aa'],
        'sqs-worker': ['sqs', 'worker', '#64e2aa'],
        'worker-dynamo': ['worker', 'dynamo', '#64e2aa'],
        'sqs-dlq': ['sqs', 'dlq', '#ff8f9b'],
        'dlq-cloudwatch': ['dlq', 'cloudwatch', '#ff8f9b']
      };

      const activeByBeat = [
        { from: 0, to: 2.2, active: [], camera: [0, 0, 1], title: ['A case', 'in motion.'], subtitle: 'from offer to verdict', accent: '#8ab5ff' },
        { from: 2.2, to: 5.6, active: ['frontend-api', 'api-lambda'], camera: [-100, 25, 1.18], title: ['The fast', 'path.'], subtitle: 'accept the signal', accent: '#8ab5ff' },
        { from: 5.6, to: 8.8, active: ['lambda-dynamo', 'lambda-sqs'], camera: [-15, -40, 1.1], title: ['State', 'before speed.'], subtitle: 'persist once · retry safely', accent: '#8ab5ff' },
        { from: 8.8, to: 13.2, active: ['sqs-worker', 'worker-dynamo'], camera: [35, -75, 1.16], title: ['Make time', 'a feature.'], subtitle: 'the user is already moving', accent: '#64e2aa' },
        { from: 13.2, to: 16.5, active: ['worker-dynamo'], camera: [55, -55, 1.12], title: ['Evidence in.', 'Verdict out.'], subtitle: 'deterministic policy decides', accent: '#64e2aa' },
        { from: 16.5, to: 18.5, active: ['sqs-dlq', 'dlq-cloudwatch'], camera: [120, -35, 1.12], title: ['Failure', 'has a shape.'], subtitle: 'retry · isolate · observe', accent: '#ff8f9b' },
        { from: 18.5, to: 20, active: ['frontend-api', 'api-lambda', 'lambda-dynamo', 'lambda-sqs', 'sqs-worker', 'worker-dynamo'], camera: [0, 0, .98], title: ['Small surface.', 'Clear control.'], subtitle: 'one case · one path · one verdict', accent: '#8ab5ff' }
      ];

      let elapsed = 0;
      let last = performance.now();
      let playing = !prefersReducedMotion;
      let recording = false;

      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
      const ease = (v) => { v = clamp(v); return v * v * (3 - 2 * v); };
      const easeOut = (v) => 1 - Math.pow(1 - clamp(v), 3);
      const fade = (time, start, end, softness = .5) => ease((time - start) / Math.max(.001, end - start)) * softness;
      const fmt = (seconds) => `00:${String(Math.floor(seconds)).padStart(2, '0')}`;

      function beatAt(time) {
        return activeByBeat.find(beat => time >= beat.from && time < beat.to) || activeByBeat[activeByBeat.length - 1];
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      function drawBackground(time) {
        const bg = ctx.createRadialGradient(W * .55, H * .42, 40, W * .52, H * .5, 1150);
        bg.addColorStop(0, '#111a2a'); bg.addColorStop(.44, '#080c14'); bg.addColorStop(1, '#05070b');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.globalAlpha = .11;
        ctx.strokeStyle = '#87a4cd'; ctx.lineWidth = 1;
        const drift = (time * 3) % 80;
        for (let x = -80 + drift; x < W + 80; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
        for (let y = -80 + drift; y < H + 80; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
        ctx.restore();
        const haze = ctx.createLinearGradient(0, 0, W, H);
        haze.addColorStop(0, 'rgba(106, 146, 255, .05)'); haze.addColorStop(.45, 'rgba(0,0,0,0)'); haze.addColorStop(1, 'rgba(184, 121, 255, .04)');
        ctx.fillStyle = haze; ctx.fillRect(0, 0, W, H);
      }

      function pathFor(key) {
        const [fromKey, toKey] = edges[key];
        const a = nodes[fromKey], b = nodes[toKey];
        const dx = b.x - a.x, dy = b.y - a.y;
        const bend = Math.min(180, Math.max(70, Math.abs(dx) * .28));
        const sign = dy >= 0 ? 1 : -1;
        const c1 = { x: a.x + dx * .42, y: a.y + sign * bend };
        const c2 = { x: b.x - dx * .42, y: b.y - sign * bend };
        return { a, c1, c2, b };
      }

      function pointOnPath(path, t) {
        const q = 1 - t;
        return {
          x: q*q*q*path.a.x + 3*q*q*t*path.c1.x + 3*q*t*t*path.c2.x + t*t*t*path.b.x,
          y: q*q*q*path.a.y + 3*q*q*t*path.c1.y + 3*q*t*t*path.c2.y + t*t*t*path.b.y
        };
      }

      function drawEdge(key, opacity, isActive, time, color) {
        const path = pathFor(key);
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = isActive ? color : '#526176';
        ctx.lineWidth = isActive ? 3 : 1.5;
        ctx.setLineDash(isActive ? [12, 14] : []);
        ctx.lineDashOffset = isActive ? -time * 90 : 0;
        ctx.beginPath(); ctx.moveTo(path.a.x, path.a.y); ctx.bezierCurveTo(path.c1.x, path.c1.y, path.c2.x, path.c2.y, path.b.x, path.b.y); ctx.stroke();
        if (isActive) {
          const p = pointOnPath(path, (time * .28) % 1);
          const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 32);
          glow.addColorStop(0, color); glow.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = glow; ctx.globalAlpha = .8; ctx.beginPath(); ctx.arc(p.x, p.y, 32, 0, TAU); ctx.fill();
          ctx.fillStyle = '#f7fbff'; ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, TAU); ctx.fill();
        }
        ctx.restore();
      }

      function drawNode(node, active, opacity, color, time) {
        ctx.save();
        ctx.globalAlpha = opacity;
        if (active) {
          const halo = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, 110);
          halo.addColorStop(0, color + '38'); halo.addColorStop(1, color + '00');
          ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(node.x, node.y, 110, 0, TAU); ctx.fill();
          ctx.strokeStyle = color; ctx.globalAlpha = opacity * .65; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(node.x, node.y, 42 + Math.sin(time * 3) * 3, 0, TAU); ctx.stroke();
        }
        ctx.globalAlpha = opacity;
        ctx.fillStyle = active ? color : '#68758a';
        ctx.beginPath(); ctx.arc(node.x, node.y, active ? 8 : 5, 0, TAU); ctx.fill();
        ctx.strokeStyle = active ? color : '#3b4656'; ctx.globalAlpha = opacity * .85; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(node.x, node.y, 16, 0, TAU); ctx.stroke();
        ctx.textAlign = 'center';
        ctx.globalAlpha = opacity * .75; ctx.fillStyle = '#a8b3c4'; ctx.font = '500 13px "SFMono-Regular", Consolas, monospace'; ctx.letterSpacing = '2px'; ctx.fillText(node.label, node.x, node.y - 34);
        ctx.globalAlpha = opacity; ctx.fillStyle = '#f2f5f9'; ctx.font = '500 22px Inter, system-ui, sans-serif'; ctx.fillText(node.name, node.x, node.y + 45);
        ctx.globalAlpha = opacity * .72; ctx.fillStyle = '#9aa7b9'; ctx.font = '400 14px Inter, system-ui, sans-serif'; ctx.fillText(node.sub, node.x, node.y + 68);
        ctx.restore();
      }

      function drawTitle(beat, time) {
        const local = clamp((time - beat.from) / 1.15);
        const alpha = easeOut(local);
        ctx.save(); ctx.globalAlpha = alpha;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#a7b3c3'; ctx.font = '500 14px "SFMono-Regular", Consolas, monospace'; ctx.letterSpacing = '3px'; ctx.fillText('C R E D A   /   SYSTEM STORY', 116, 116);
        ctx.fillStyle = '#f5f7fb'; ctx.font = '500 80px Inter, system-ui, sans-serif'; ctx.letterSpacing = '-4px'; ctx.fillText(beat.title[0], 116, 202);
        ctx.fillStyle = beat.accent; ctx.fillText(beat.title[1], 116, 286);
        ctx.fillStyle = '#aeb9c8'; ctx.font = '400 21px Inter, system-ui, sans-serif'; ctx.letterSpacing = '0px'; ctx.fillText(beat.subtitle, 119, 332);
        ctx.restore();
      }

      function drawTag(text, x, y, color, alpha) {
        ctx.save(); ctx.globalAlpha = alpha; ctx.font = '500 14px "SFMono-Regular", Consolas, monospace';
        const pad = 13, width = ctx.measureText(text).width + pad * 2;
        roundRect(x, y, width, 34, 17); ctx.fillStyle = color + '19'; ctx.fill(); ctx.strokeStyle = color + '74'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = color; ctx.fillText(text, x + pad, y + 22); ctx.restore();
      }

      function draw(time) {
        const beat = beatAt(time);
        drawBackground(time);
        ctx.save();
        const cameraProgress = ease(clamp((time - beat.from) / .95));
        const cam = beat.camera;
        const zoom = 1 + (cam[2] - 1) * cameraProgress;
        const panX = cam[0] * cameraProgress, panY = cam[1] * cameraProgress;
        ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2 + panX, -H / 2 + panY);

        const reveal = clamp(time / 2.3);
        Object.entries(edges).forEach(([key, data], i) => {
          const active = beat.active.includes(key);
          const opacity = active ? 1 : .18 + .22 * reveal;
          drawEdge(key, opacity, active, time + i * .17, data[2]);
        });
        Object.entries(nodes).forEach(([key, node], i) => {
          const active = beat.active.some(keyName => edges[keyName]?.includes(key));
          const opacity = active ? 1 : .22 + .48 * reveal;
          drawNode(node, active, opacity, node.color, time + i * .14);
        });
        ctx.restore();

        drawTitle(beat, time);
        if (time >= 12.2 && time < 16.5) drawTag('COMPLETED', 1450, 888, '#64e2aa', ease((time - 12.2) / .8));
        if (time >= 16.5 && time < 18.5) drawTag('RETRY  →  OBSERVE', 1390, 888, '#ff8f9b', ease((time - 16.5) / .6));
        if (time >= 18.5) {
          const alpha = ease((time - 18.5) / .7);
          drawTag('DETERMINISTIC', 116, 905, '#8ab5ff', alpha);
          drawTag('ASYNC', 310, 905, '#64e2aa', alpha);
          drawTag('RECOVERABLE', 432, 905, '#ff8f9b', alpha);
        }
        timeLabel.textContent = fmt(time);
        scrub.value = time;
      }

      function tick(now) {
        const dt = Math.min(.05, (now - last) / 1000); last = now;
        if (playing) { elapsed += dt; if (elapsed >= DURATION) { elapsed = 0; if (recording) finishRecording(); } }
        draw(elapsed); requestAnimationFrame(tick);
      }

      function setTime(value) { elapsed = clamp(Number(value), 0, DURATION); draw(elapsed); }
      function togglePlay() { playing = !playing; playButton.textContent = playing ? 'Pause' : 'Play'; }

      async function renderWebM() {
        if (!canvas.captureStream || !window.MediaRecorder) { alert('This browser cannot export WebM from canvas. Use the HTML preview or the FFmpeg render path.'); return; }
        recording = true; playing = true; elapsed = 0; document.body.classList.add('recording');
        const stream = canvas.captureStream(30);
        const chunks = [];
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
        const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 });
        window.__motionRecorder = recorder;
        recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: mime });
          const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'architecture-motion.webm'; a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000); recording = false; document.body.classList.remove('recording'); playing = false; playButton.textContent = 'Play';
        };
        recorder.start(250);
      }

      function finishRecording() { if (window.__motionRecorder?.state === 'recording') window.__motionRecorder.stop(); }

      playButton.addEventListener('click', togglePlay);
      renderButton.addEventListener('click', renderWebM);
      scrub.addEventListener('input', event => { playing = false; playButton.textContent = 'Play'; setTime(event.target.value); });
      document.addEventListener('keydown', event => {
        if (event.key === ' ') { event.preventDefault(); togglePlay(); }
        if (event.key === 'ArrowRight') setTime(elapsed + .5);
        if (event.key === 'ArrowLeft') setTime(elapsed - .5);
        if (event.key.toLowerCase() === 'r') renderWebM();
      });
      draw(0); requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>

version: 1
updated_at: '2026-09-17'
# Employer coverage matrix for impersonation-prone companies.
# Fetch: python scripts/fetch_employer_registry.py
# Process: python scripts/run_etl.py

employers:
  # --- Big tech (global) ---
  - employer_key: amazon
    display_name: Amazon
    company_tier: big_tech
    regions: [global, india, us, eu]
    scam_target_priority: critical
    official_domains: [amazon.com, amazon.jobs, joining.docs.amazon.com]
    official_careers_urls: [https://www.amazon.jobs/]
    aliases: [amazon, amazon india, amazon jobs, aws hiring]
    policy:
      source_id: amazon_recruitment_fraud_policy
      canonical_url: https://amazon.jobs/content/en/how-we-hire/fraud-alert-india
      fetch: {method: direct, url: "https://amazon.jobs/content/en/how-we-hire/fraud-alert-india", filename: index.html}


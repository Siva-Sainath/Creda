version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          if [ -z "$CREDA_API_URL" ]; then
            echo "CREDA_API_URL not set — using placeholder default in frontend/index.html"
            export CREDA_API_URL="https://x1ed4uf5q9.execute-api.ap-south-1.amazonaws.com"
          fi
        - sed -i "s|__CREDA_API_URL__|${CREDA_API_URL}|g" frontend/index.html
    build:
      commands:
        - test -f frontend/index.html
        - grep -q "${CREDA_API_URL}" frontend/index.html
  artifacts:
    baseDirectory: frontend
    files:
      - '**/*'
  cache:
    paths: []

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Creda Check</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="investigate.css" />
  <link rel="stylesheet" href="cropper.min.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <div class="brand">Creda</div>
        <div class="sub">Check this recruitment message</div>
      </div>
      <button id="btn-close" type="button">Close</button>
    </header>
    <div class="panels">
      <section class="input-panel">
        <label for="captured-text">Message text</label>
        <textarea id="captured-text" placeholder="Selected text appears here. Add more if needed."></textarea>
        <label for="captured-url">Links</label>
        <input id="captured-url" type="text" placeholder="Page URL and links" />
        <div class="shot-wrap">
          <img id="screenshot-image" alt="Screenshot preview" />
        </div>
        <button id="btn-check" type="button" class="primary">Check with Creda</button>
      </section>
      <section class="result-panel">
        <div id="loading-view" class="view active">
          <p id="loading-status">Creda is running evidence checks…</p>
        </div>
        <div id="result-view" class="view">
          <div id="verdict-banner" class="vchip"><span id="verdict-title">VERDICT</span></div>
          <p id="verdict-headline"></p>
          <div id="evidence-list"></div>
        </div>
      </section>
    </div>
  </div>
  <script src="cropper.min.js"></script>
  <script src="investigate.js"></script>
</body>
</html>
